<!-- demos/lueur/index.html -->
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Le titre et la description sont remplis par config.js -->
    <title>Mes liens</title>
    <meta name="description" content="Tous mes liens au même endroit ✦">
    <meta name="theme-color" content="#1c1538">
    <link rel="icon" href="images/avatar.png">
    <link rel="stylesheet" href="assets/style.css">
</head>
<body>

    <!-- Décor : ciel étoilé (créé par script.js) -->
    <div class="ciel" aria-hidden="true"></div>

    <main class="page">

        <!-- Profil -->
        <header class="profil">
            <div class="photo-cadre">
                <img class="photo" id="photo" src="images/avatar.png" alt="">
            </div>
            <h1 id="nom"></h1>
            <p class="bio" id="bio"></p>
        </header>

        <!-- Liens (remplis par script.js à partir de config.js) -->
        <nav class="liens" id="liens" aria-label="Mes liens"></nav>

        <!-- E-mail -->
        <div class="email" id="email" hidden>
            <span class="email-texte" id="email-texte"></span>
            <button type="button" class="petit-bouton" id="copier-email">Copier</button>
        </div>

        <!-- Réseaux -->
        <div class="reseaux" id="reseaux"></div>

        <!-- Partager la page -->
        <button type="button" class="partager" id="partager">↗ Partager ma page</button>

        <footer class="pied" id="pied"></footer>
    </main>

    <!-- Petite bulle de confirmation -->
    <div class="bulle" id="bulle" role="status" aria-live="polite"></div>

    <script src="config.js"></script>
    <script src="assets/script.js"></script>
</body>
</html>
